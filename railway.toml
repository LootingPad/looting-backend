# Default service = API. For the indexer service, override Start Command in
# Railway UI to: npm run start:indexer
#
# Nixpacks already runs `npm ci` in the install phase — do not re-run it in
# buildCommand (that caused exit 240 on Railway).
[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy && npm start"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
