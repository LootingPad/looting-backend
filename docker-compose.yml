services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: looting
      POSTGRES_PASSWORD: looting
      POSTGRES_DB: looting
    volumes:
      - looting_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looting -d looting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  looting_pg:
